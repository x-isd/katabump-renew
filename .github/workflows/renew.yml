name: Katabump Auto Renew

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    concurrency:
      group: katabump-check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Syntax and unit checks
      run: |
        npm run check
        python3 -m py_compile proxy_handler.py

    - name: Load runtime dependencies
      run: node -e "require('axios'); require('playwright-extra'); require('puppeteer-extra-plugin-stealth')"

  renew:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: katabump-renew
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb netcat-openbsd curl wget python3
        npm ci
        npx playwright install-deps chrome

    - name: Restore proxy cooldown cache
      uses: actions/cache/restore@v4
      with:
        path: proxy-cooldown.json
        key: katabump-proxy-cooldown-${{ github.run_id }}
        restore-keys: |
          katabump-proxy-cooldown-

    - name: Start multi-protocol proxy (sing-box)
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        if [ -z "$PROXY_URL" ]; then
          echo "PROXY_URL is empty; multi-protocol proxy disabled."
          exit 0
        fi

        SINGBOX_VER="1.13.16"
        echo "Downloading sing-box v${SINGBOX_VER}..."
        wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
        chmod +x ./sing-box

        echo "Generating sing-box config from PROXY_URL..."
        python3 proxy_handler.py
        nohup ./sing-box run -c config.json > singbox.log 2>&1 &
        echo "PROXY_SERVER=http://127.0.0.1:8080" >> "$GITHUB_ENV"

        proxy_ready=false
        for i in $(seq 1 30); do
          if curl -fsS --connect-timeout 5 --max-time 15 \
              -x http://127.0.0.1:8080 https://api.ip.sb/ip \
              -o /tmp/katabump-proxy-ip; then
            proxy_ready=true
            break
          fi
          sleep 2
        done

        if [ "$proxy_ready" != "true" ]; then
          echo "❌ sing-box started but local proxy connectivity failed"
          exit 1
        fi
        if ! pgrep -f "./sing-box" > /dev/null; then
          echo "❌ sing-box process is not running"
          exit 1
        fi
        echo "✅ Multi-protocol proxy is ready at http://127.0.0.1:8080"

    - name: Download proxy list
      env:
        WEBSHARE_PROXY_LIST_URL: ${{ secrets.WEBSHARE_PROXY_LIST_URL }}
      run: |
        if [ -n "${PROXY_SERVER:-}" ]; then
          echo "PROXY_URL mode is active; skipping Webshare proxy list."
          exit 0
        fi
        if [ -n "$WEBSHARE_PROXY_LIST_URL" ]; then
          echo "Downloading Webshare proxy list..."
          curl -fsSL \
            --retry 3 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            "${WEBSHARE_PROXY_LIST_URL}" \
            -o proxies.txt
          echo "Proxy list downloaded. Lines: $(wc -l < proxies.txt)"
        else
          echo "WEBSHARE_PROXY_LIST_URL is empty, running without Webshare proxy."
        fi

    - name: Syntax Check
      run: |
        npm run check
        python3 -m py_compile proxy_handler.py

    - name: Run proxy runner (with dynamic proxy coverage)
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node proxy_runner.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: |
          screenshots/
          singbox.log

    - name: Save proxy cooldown cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: proxy-cooldown.json
        key: katabump-proxy-cooldown-${{ github.run_id }}
